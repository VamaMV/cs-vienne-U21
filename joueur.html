    const nom=String(n).split(" ")[0].toLowerCase();
    return x.toLowerCase().indexOf(nom.charAt(0)+nom.slice(1))>=0||x.toLowerCase().indexOf(nom)>=0?"safety bar":"";
  }).filter(Boolean).join(" · ");
}
function valeur(v){ v=String(v==null?"—":v).replace(".",","); return esc(v)+(/^[\d,]+$/.test(v)?"<small>kg</small>":""); }
let D=null, SEL=null;
function rendu(){
  const p=D.p, cy=CY[SEL.c], jr=cy.d[SEL.d];
  const l=muLundiSemaine(SEL.c,SEL.i); const dj=new Date(l); dj.setUTCDate(l.getUTCDate()+JOURS.indexOf(String(jr[0]).toLowerCase()));
  const sem=cy.wk[SEL.i];
  document.getElementById("sub").textContent=dateFr(dj).replace(/^./,function(x){ return x.toUpperCase(); })+" · "+String(jr[1]).replace(/^J-\d+ · /,"")+" · "+sem[1];
  const adv=String(sem[0]||""); const chips=[];
  if(adv&&!/SANS MATCH|DÉCHARGE/.test(adv)) chips.push("Match : "+adv.charAt(0)+adv.slice(1).toLowerCase());
  else if(adv) chips.push(adv.charAt(0)+adv.slice(1).toLowerCase());
  chips.push("Profil "+(p.prof||"socle"));
  document.getElementById("chips").innerHTML=chips.map(function(x){ return "<span>"+esc(x)+"</span>"; }).join("");
  let h="";
  if(cy.d.length>1) h+='<div class="days">'+cy.d.map(function(j,k){ return '<button class="'+(k===SEL.d?"on":"")+'" onclick="SEL.d='+k+';rendu()">'+esc(j[0])+'<small>'+esc(String(j[1]).split(" · ")[0])+'</small></button>'; }).join("")+'</div>';
  const iso=dSess(SEL.c,SEL.i,SEL.d), auj=muAujISO(), jourJ=iso===auj;
  if(!SEL.cette) h+='<div class="etat bleu"><div class="l"><b>Plus de muscu cette semaine</b></div><p>Voici ta prochaine séance.</p></div>';
  const pp=Object.assign({n:D.n},p);
  const base=muSessConstruite(pp,cy,SEL.d,SEL.i);
  const env=(D.envoi&&D.envoi.date===iso&&String(D.envoi.d).toLowerCase()===String(jr[0]).toLowerCase()&&Array.isArray(D.envoi.rows))?D.envoi:null;
  const rows=env?env.rows.map(function(r){ return [r.b,r.nom,r.det,{v:(r.v===""||r.v==null)?"—":r.v,sub:r.sub||""},"","",r.fl||"",r.why||"",r.prevu||""]; })
    :muAdapter(pp,base,SEL.c,SEL.d,SEL.i).map(function(r,k){ const x=r.slice(); if(x[6]) x[8]=muPrevu(x,base[k]); return x; });
  /* bandeaux */
  const sj=muEtatSeance(pp,SEL.c,SEL.d,SEL.i), et=muEtat(pp,SEL.c,SEL.i);
  if(env){
    h+='<div class="etat vert"><div class="l"><b>Séance validée par le staff</b></div><p>Envoyée à '+esc(env.t)+'. Fais exactement ce qui est écrit ci-dessous'+(rows.some(function(r){ return r[6]; })?', les lignes en couleur ont été changées pour toi.':'.')+'</p></div>';
  } else if(sj){
    const cls={frais:"vert",correct:"jaune",vigil:"jaune",entame:"orange",rouge:"rouge"}[sj.niv]||"gris";
    const tit={frais:"Frais ce matin",correct:"Correct ce matin",vigil:sj.sym?"Symptômes légers ce matin":"Un peu entamé ce matin",entame:"Entamé ce matin",rouge:sj.mal?"Malade ce matin":"Dans le rouge ce matin"}[sj.niv]||"Ta réponse du matin";
    const q=muEtatConsignes(sj);
    if(sj.lvl>=3) q.push("Vois le staff avant de commencer.");
    if(!q.length) q.push("Séance normale, comme prévu.");
    h+='<div class="etat '+cls+'"><div class="l"><b>'+tit+'</b>'+(sj.h!=null?'<div class="sc">'+sj.h+'<small> / 28</small></div>':'')+'</div>'
      +(sj.h!=null?'<div class="bar"><i style="left:calc('+(Math.min(28,sj.h)/28*100).toFixed(1)+'% - 1px)"></i></div>':'')+'<p>'+q.join(" ")+'</p></div>';
  } else if(jourJ){
    h+='<div class="etat gris"><div class="l"><b>Pas encore de réponse Wellness aujourd’hui</b></div><p>Remplis le formulaire du matin : ta séance s’adaptera à ton état.</p></div>';
  }
  if(et.ep&&!env) h+='<div class="etat rouge"><div class="l"><b>Suivi par le staff</b></div><p>'+(et.tout?"Ta séance est à valider avec le staff avant de commencer.":"Les exercices marqués sont à valider avec le staff, le reste est maintenu.")+'</p></div>';
  if(!env&&et.min&&et.min.min>60&&/mardi/i.test(jr[0])) h+='<div class="etat bleu"><div class="l"><b>'+et.min.min+'′ au dernier match</b></div><p>Une série en moins sur le premier exercice.</p></div>';
  h+='<h2>'+(jourJ?"Séance du jour":(iso>auj?"Séance à venir":"Séance passée"))+'</h2><div class="card">';
  let cur=null;
  rows.forEach(function(r){
    const b=String(r[0]||""), k=b.charAt(0);
    if(k!==cur){ cur=k; const t=BL[k]||[k,""]; h+='<div class="blk"><span>'+esc(k)+'</span>'+esc(t[0])+'<em>'+esc(r[5]||t[1])+'</em></div>'; }
    const det=detJoueur(r[2],D.n);
    h+='<div class="ex '+(r[6]==="adapt"?"adapt":(r[6]==="tdj"?"tdj":""))+'"><div class="b">'+esc(b)+'</div><div class="t"><b>'+esc(r[1])+'</b>'+(det?'<span>'+esc(det)+'</span>':'')
      +(r[6]&&r[7]?'<em class="why">'+esc(r[7])+'</em>':'')+'</div>'
      +'<div class="v"><b>'+valeur(r[3]&&r[3].v)+'</b><span>'+esc((r[3]&&r[3].sub)||"")+'</span>'+(r[8]?'<s>'+esc(r[8])+'</s>':'')+'</div></div>';
  });
  h+='</div>';
  if(Array.isArray(p.prehab)&&p.prehab.length){
    h+='<h2>Ma préhab · 2 fois par semaine</h2>'+p.prehab.map(function(x){ return '<div class="pr"><b>Préhab</b><div><span>'+esc(x[0])+'</span><em>'+esc(x[1])+'</em></div></div>'; }).join("");
  }
  h+='<div class="ft">'+(sj&&D.etat.e.t?"Adaptée à ta réponse Wellness de "+esc(D.etat.e.t)+".<br>":"")+'Charges en kg pour la dernière série, par main pour les haltères.</div>';
  document.getElementById("app").innerHTML=h;
}
async function go(){
  const t=new URLSearchParams(location.search).get("t")||"";
  const app=document.getElementById("app");
  try{
    const r=await fetch(SUPA_URL+"/rest/v1/rpc/seance_joueur",{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY},body:JSON.stringify({tok:t})});
    if(!r.ok) throw new Error("lien");
    D=await r.json();
  }catch(e){ document.getElementById("nom").textContent="Lien invalide"; app.innerHTML='<div class="msg"><b>Ce lien ne marche pas</b>Demande ton lien perso à Matis.</div>'; return; }
  H=D.h||{}; MU_ETAT=D.etat?{date:D.etat.date,joueurs:{}}:null; if(MU_ETAT) MU_ETAT.joueurs[D.n]=D.etat.e;
  CY=(D.cycles||[]).map(function(b){ return {id:b.id,n:b.n,built:true,deb:b.deb,fin:b.fin,d:b.d,seances:b.seances,schemas:b.schemas||null,
    wk:muSemainesEntre(b.deb,b.fin).map(function(n){ return [(b.etiquettes&&b.etiquettes[n])||(D.labels&&D.labels[n])||"","S"+n]; })}; });
  document.getElementById("nom").textContent=prenomNom(D.n);
  SEL=choisir();
  if(!SEL){ app.innerHTML='<div class="msg"><b>Pas de séance programmée</b>Le prochain cycle arrive bientôt.</div>'; return; }
  rendu();
}
go();
